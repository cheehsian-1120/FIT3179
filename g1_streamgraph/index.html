<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Health in Australia</title>
    <!-- Import Vega & Vega-Lite scripts -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.25.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.15.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.22.2"></script>
    <!-- Import CSS -->
    <link rel="stylesheet" href="css/streamgraph.css">
</head>

<body>
    <div class="visualisation-container">
        <!-- Chart 1 Container -->
        <div class="chart-section">
            <div id="streamgraph"></div>
            <div class="annotation">
            </div>
        </div>
    </div>

    <script>
        // Embed the Vega-Lite Streamgraph
        var spec1 = "js/streamgraph.json";
        vegaEmbed('#streamgraph', spec1, { actions: false }).then(function (result) {
            // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
        }).catch(console.error);
    </script>
</body>

</html>
