<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pharmaceutical Response</title>
    
    <!-- Vega-Lite Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    
    <!-- Link to Stylesheet -->
    <link rel="stylesheet" href="lollipop.css">
</head>
<body>

<div class="dashboard-container">

    <div class="dashboard-header">
        <h1>The Pharmaceutical Response</h1>

    </div>

    <!-- The Vega-Lite chart will render here -->
    <div id="vis"></div>

<script>
    // Load the Lollipop Chart JSON spec
    vegaEmbed('#vis', 'lollipop.json', { actions: false }).catch(console.error);
</script>
