<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age and Gender</title>
    
    <!-- Import Vega & Vega-Lite scripts -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.25.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.15.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.22.2"></script>
    
    <!-- Import CSS -->
    <link rel="stylesheet" href="divergingBarChart.css">
</head>

<body>
    <div class="visualisation-container">

        <!-- Chart 2: Population Pyramid -->
        <div class="chart-section">
            <div id="divergingBarChart"></div>
        </div>

    </div>

    <!-- Script to render the chart -->
    <script>
        // Embed the Vega-Lite Population Pyramid (Graph 2)
        var spec2 = "divergingBarChart.json";
        vegaEmbed('#divergingBarChart', spec2, { actions: false }).catch(console.error);
    </script>
</body>

</html>
